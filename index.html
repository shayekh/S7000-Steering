<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Service 7000 – Steering Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F4FA; --panel:#FFFFFF; --ink:#1B1F3B; --muted:#6B7090; --line:#E5E7F2;
  --primary:#5B5FEF; --primary-soft:#E9EAFD;
  --plan:#9AA0C3; --plan-soft:#EEF0F8;
  --dev:#1DA1E0; --dev-soft:#DDF1FB;
  --test:#8B5CF6; --test-soft:#EDE5FD;
  --live:#1FA463; --live-soft:#DAF3E6;
  --warn:#A9680B; --warn-soft:#FBEFD5;
  --bad:#B83232; --bad-soft:#F8DADA;
  --shadow:0 1px 2px rgba(27,31,59,.04),0 8px 24px rgba(27,31,59,.06);
  --font:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1020; --panel:#171A30; --ink:#E9EBFA; --muted:#9A9FC4; --line:#272B48;
    --primary:#8A8DFF; --primary-soft:#25295A;
    --plan:#7F86B0; --plan-soft:#23274A;
    --dev:#4CC0F5; --dev-soft:#12303F;
    --test:#AE8DFF; --test-soft:#2D2556;
    --live:#4CC38A; --live-soft:#163A2B;
    --warn:#E8B64A; --warn-soft:#3B2F12;
    --bad:#F08080; --bad-soft:#4A2325;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1020; --panel:#171A30; --ink:#E9EBFA; --muted:#9A9FC4; --line:#272B48;
  --primary:#8A8DFF; --primary-soft:#25295A;
  --plan:#7F86B0; --plan-soft:#23274A;
  --dev:#4CC0F5; --dev-soft:#12303F;
  --test:#AE8DFF; --test-soft:#2D2556;
  --live:#4CC38A; --live-soft:#163A2B;
    --warn:#E8B64A; --warn-soft:#3B2F12;
    --bad:#F08080; --bad-soft:#4A2325;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;letter-spacing:-.015em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
@media(min-width:960px){.app{grid-template-columns:232px minmax(0,1fr)}}
.side{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:14px}
@media(min-width:960px){.side{border-bottom:0;border-right:1px solid var(--line);padding:26px 18px;position:sticky;top:0;height:100vh}}
.logo{display:flex;align-items:center;background:#FFFFFF;border:1px solid var(--line);border-radius:12px;padding:8px 12px;align-self:flex-start}
.logo img{display:block;height:44px;width:auto;max-width:100%}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--primary);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.nav{display:flex;gap:6px;overflow-x:auto}
@media(min-width:960px){.nav{flex-direction:column;gap:4px;margin-top:10px}}
.nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;padding:9px 12px;border-radius:10px;white-space:nowrap}
.nav a:hover{background:var(--plan-soft);color:var(--ink)}
.nav a.on{background:var(--primary-soft);color:var(--primary)}
.sidefoot{display:none;margin-top:auto;font-size:12.5px;color:var(--muted)}
@media(min-width:960px){.sidefoot{display:block}}

.main{padding:22px 16px 56px;width:100%;min-width:0}
@media(min-width:960px){.main{padding:30px 34px 64px}}
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
.head h1{font-size:clamp(24px,3.6vw,34px);font-weight:800;line-height:1.15;max-width:34ch}
.head p{margin:6px 0 0;color:var(--muted);max-width:90ch;font-size:17px;font-weight:500}
.tools{display:flex;gap:8px;align-items:center}
.pill{background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--muted)}
.theme{cursor:pointer}

.card{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:20px;border:1px solid var(--line)}
.card h2{font-size:17px;font-weight:700}
.sub{color:var(--muted);font-size:13px;margin:3px 0 14px}

.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));margin-bottom:18px}
.kpi{border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .n{font-size:32px;font-weight:800;line-height:1.1}
.kpi .d{font-size:12.5px;color:var(--muted)}
.kpi.live{background:var(--live-soft)} .kpi.live .n{color:var(--live)}
.kpi.test{background:var(--test-soft)} .kpi.test .n{color:var(--test)}
.kpi.dev{background:var(--dev-soft)} .kpi.dev .n{color:var(--dev)}
.kpi.plan{background:var(--plan-soft)} .kpi.plan .n{color:var(--plan)}
.kpi.warn{background:var(--warn-soft)} .kpi.warn .n{color:var(--warn)}
.ring{width:54px;height:54px;float:right;margin:-6px -4px 0 0}

.sec{margin-bottom:18px}
.sec-h{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 13px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}

.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);min-height:180px}
.col-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:12px}
.col-h i{width:10px;height:10px;border-radius:50%}
.col-h span{margin-left:auto;font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px}
.item{border-radius:12px;padding:11px 12px;margin-bottom:10px;border:1px solid var(--line);background:var(--bg)}
.item b{font-weight:600;font-size:14px;display:block;line-height:1.3}
.item .m{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.tag{padding:1px 9px;border-radius:99px;font-weight:600;font-size:11.5px;background:var(--primary-soft);color:var(--primary)}
.empty{font-size:13px;color:var(--muted);padding:14px 2px;text-align:center}
.simple{display:flex;flex-direction:column;min-height:calc(100vh - 100px)}
.simple .scenter{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 0 40px}
.sbox{width:100%;max-width:560px;text-align:center;padding:36px 28px}
.sbox .phrow,.sbox .meta{justify-content:center}
.sbox p.lead{margin:12px auto 0;font-size:16px}
.nt{font-size:12.5px;color:var(--muted);margin-top:4px}

.two{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:1180px){.two{grid-template-columns:1.2fr 1fr}}
.ws{padding:12px 0;border-top:1px solid var(--line)}
.ws:first-of-type{border-top:0}
.ws .t{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14px}
.ws .t small{font-weight:500;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;margin-top:8px;background:var(--plan-soft)}
.bar div{min-width:4px}
.sign{padding:10px 0;border-top:1px solid var(--line)}
.sign:first-of-type{border-top:0}
.sign b{font-weight:600;display:block}
.sign small{color:var(--muted)}
.win{display:flex;gap:14px;align-items:center;background:var(--live-soft);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.win .big{font-size:38px;font-weight:800;line-height:1;color:var(--live)}
.win b{display:block;font-weight:700}
.win span{font-size:13px;color:var(--muted)}
.wip{display:flex;gap:6px;margin:8px 0 6px}
.wip i{width:34px;height:12px;border-radius:6px;background:var(--line)}
.wip i.on{background:var(--test)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%}
.sec-title{font-size:19px;font-weight:800;margin-bottom:4px}
.sec-sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.blk{margin-bottom:18px}
.blk h2{display:flex;align-items:center;gap:10px}
.blk h2 i{width:10px;height:10px;border-radius:50%}
.rgrid{display:grid;gap:12px;grid-template-columns:1fr}
.rgrid.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.rgrid.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.rc{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.rc .rh{display:flex;align-items:center;gap:10px}
.rc .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.rc.well .ic{background:var(--live-soft);color:var(--live)}
.rc.could .ic{background:var(--warn-soft);color:var(--warn)}
.rc b{font-weight:700;font-size:14.5px;line-height:1.3}
.rc p{margin:0;font-size:13.5px;color:var(--muted)}
.act{margin-top:auto;background:var(--warn-soft);border-radius:10px;padding:9px 11px;font-size:13.5px}
.act small{display:block;font-weight:800;color:var(--warn);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
@supports (grid-template-rows:subgrid){.rc.could{display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:8px}.rc.could .act{margin-top:0;align-self:stretch}}
.note{margin-top:12px;background:var(--primary-soft);color:var(--primary);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
.q{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:10px}
.q .qh{display:flex;gap:12px;align-items:center}
.q .no{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.q b{font-size:15.5px;font-weight:700;line-height:1.3}
.q p{margin:0;font-size:13.5px;color:var(--muted)}
.q ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.q li{display:flex;gap:8px}
.q li::before{content:"\2713";color:var(--live);font-weight:800}
.q .pf{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;font-size:12px;color:var(--muted)}
.pri{padding:4px 16px;border-radius:99px;font-weight:700;font-size:12.5px;background:var(--ink);color:var(--panel)}
.pri.prop{background:var(--warn-soft);color:var(--warn);border:1.5px dashed var(--warn)}
.pri.req{background:var(--primary-soft);color:var(--primary)}
.goal{margin-top:14px;background:var(--ink);color:var(--panel);border-radius:14px;padding:14px 18px;font-weight:700;font-size:14.5px}
.goal span{font-weight:500;opacity:.85}
.hgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.hc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.hc b{font-weight:700;font-size:14.5px}
.hc small{color:var(--muted);font-size:12.5px}
.hp{align-self:flex-start;padding:3px 12px;border-radius:99px;font-size:12.5px;font-weight:700}
.hp.ok{background:var(--live-soft);color:var(--live)}
.hp.risk{background:var(--warn-soft);color:var(--warn)}
.hp.bad{background:var(--bad-soft);color:var(--bad)}
.hp.goals{background:var(--primary-soft);color:var(--primary)}
.hstats{display:flex;flex-wrap:wrap;gap:6px}
.subh{font-size:16px;font-weight:800;margin:20px 0 10px}
.dgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.dcard{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.dcard h3{margin:0 0 10px;font-size:16px;font-weight:800;display:flex;justify-content:space-between;gap:10px;align-items:center}
.dcard dl{margin:0;display:grid;gap:10px}
.dcard dt{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.dcard dd{margin:2px 0 0;font-size:14px}
.tbc{color:var(--muted);font-style:italic}
.om{font-size:13.5px}
.ms{list-style:none;margin:0;padding:0;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.mil{border:1px dashed var(--line);border-radius:14px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.mil.live{background:var(--live-soft);border:1px solid transparent}
.mil.test{background:var(--primary-soft);border:2px solid var(--primary)}
.mtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.msd{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;border:2px solid var(--plan);color:var(--plan);background:var(--panel)}
.mil.live .msd{background:var(--live);border-color:var(--live);color:var(--panel)}
.mil.test .msd{border-color:var(--primary);color:var(--primary)}
.mil.live .chipst,.mil.test .chipst{background:var(--panel)}
.mil b{font-weight:700;font-size:15px;line-height:1.3}
.mil p{margin:0;font-size:13.5px}
.mil small{margin-top:auto;color:var(--muted);font-size:12.5px}
.om small{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}

.q.wide{grid-column:1/-1}
.plan{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px}
.plan .ph{display:flex;justify-content:space-between;padding:8px 12px;background:var(--bg);font-weight:700;color:var(--muted);font-size:12px}
.plan .pr{display:grid;grid-template-columns:minmax(0,1fr) 90px 36px;gap:12px;align-items:center;padding:7px 12px;border-top:1px solid var(--line)}
@media(min-width:760px){.plan .pr{grid-template-columns:minmax(0,1fr) 280px 40px}}
.plan .pr i{height:8px;border-radius:4px;background:var(--plan-soft);display:block;overflow:hidden}
.plan .pr u{display:block;height:100%;background:var(--primary);border-radius:4px;text-decoration:none}
.plan .pr b{text-align:right;font-weight:700}
.plan .tot{background:var(--primary-soft);font-weight:800}
.plan .tot i{background:transparent}
.plan .tot b{color:var(--primary)}


.fl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fs{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;font-weight:700;font-size:13.5px}
.fs.h{background:var(--live-soft);color:var(--live)}
.fs.ai{background:var(--test-soft);color:var(--test)}
.fl .ar{color:var(--muted);font-weight:700}
.fkey{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.fkey span{display:flex;align-items:center;gap:6px}
.fkey i{width:9px;height:9px;border-radius:50%}
.cl{margin:0;padding-left:18px;font-size:14px;display:grid;gap:6px}
.raci td:not(:first-child),.raci th:not(:first-child){text-align:center}
.rb{display:inline-block;min-width:26px;padding:2px 8px;border-radius:8px;font-weight:800;font-size:12.5px;background:var(--plan-soft);color:var(--muted)}
.rb.a{background:var(--primary-soft);color:var(--primary)}
.rb.r{background:var(--live-soft);color:var(--live)}
.pillar{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.pillar b{font-weight:700;font-size:14.5px}
.pillar p{margin:0;font-size:13.5px;color:var(--muted)}
.banner{background:var(--ink);color:var(--panel);border-radius:14px;padding:14px 18px;font-weight:700;font-size:15px;margin-bottom:16px}
.banner span{font-weight:500;opacity:.85}
.sddwrap{max-width:560px;margin:0 auto 20px}
.sdd{list-style:none;margin:0;padding:0}
.sdd li{display:flex;flex-direction:column;align-items:center}
.sdd li:not(:last-child)::after{content:"\2193";color:var(--muted);font-weight:800;font-size:18px;line-height:1;padding:5px 0}
.sdd .st{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 16px;background:var(--bg)}
.sdd .st .no{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--ink);color:var(--panel)}
.sdd .st b{display:block;font-weight:700;font-size:14.5px;line-height:1.3}
.sdd .st .d{display:block;font-size:13px;color:var(--muted);margin:2px 0 6px}
.sdd .st.h{border-color:var(--live);background:var(--live-soft)}
.sdd .st.ai{border-color:var(--test);background:var(--test-soft)}
.sdd .st.b{border-color:var(--primary);background:var(--primary-soft)}
.tg{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--panel)}
.tg.h{color:var(--live)}
.tg.ai{color:var(--test)}
.tg.b{color:var(--primary)}
.sddloop{margin-top:12px;border:1.5px dashed var(--primary);color:var(--primary);background:var(--primary-soft);border-radius:14px;padding:10px 14px;text-align:center;font-weight:700;font-size:13.5px}
.sddgrid{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1100px){.sddgrid{grid-template-columns:minmax(0,520px) minmax(0,1fr);align-items:stretch}}
.sddr{display:flex;flex-direction:column;gap:14px;min-width:0}
.sddr .subh{margin:0}
.sddr .nn.later{flex:1}
.sddgrid .sddwrap{margin:0 auto}
@media(min-width:1100px){.sddgrid .sddwrap{margin:0}}
body.locked .app{display:none}
#login{display:none;min-height:100vh;place-items:center;padding:24px 16px;background:var(--bg)}
body.locked #login{display:grid}
.lgcard{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px 26px;display:flex;flex-direction:column}
.lglogo{align-self:center;margin-bottom:14px}
.lgcard h1{margin:0;text-align:center;font-size:24px;font-weight:800}
.lgsub{margin:4px 0 12px;text-align:center;color:var(--muted);font-size:14px}
.lgcard label{font-size:13px;font-weight:700;margin-top:10px}
.lgcard input{width:100%;box-sizing:border-box;margin-top:6px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.lgcard input:focus{outline:2px solid var(--primary);outline-offset:1px}
.lgpw{position:relative}
.lgpw input{padding-right:64px}
.lgshow{position:absolute;right:8px;top:calc(50% + 3px);transform:translateY(-50%);background:none;border:0;color:var(--primary);font-weight:700;font-size:12.5px;cursor:pointer;padding:4px 6px}
.lgerr{margin:10px 0 0;color:var(--bad);font-size:13px;font-weight:600}
.lgbtn{margin-top:16px;padding:12px;border:0;border-radius:10px;background:var(--primary);color:#fff;font:inherit;font-weight:800;cursor:pointer}
.lgbtn:hover{filter:brightness(1.08)}
.lgdemo{margin-top:18px;padding:12px;border-radius:10px;background:var(--primary-soft);color:var(--ink);font-size:12.5px;line-height:1.55}
.lgdemo code{font-weight:700}
.lgdemo button{margin-left:6px;border:0;background:none;color:var(--primary);font-weight:700;font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline}
.signout{margin-top:auto;align-self:flex-start;cursor:pointer}
[hidden]{display:none!important}
.scroll{overflow-x:auto;max-width:100%}
.hc.link{text-decoration:none;color:inherit;border-color:var(--primary);cursor:pointer}
.hc.link:hover{background:var(--primary-soft)}
.go{color:var(--primary);font-weight:700;font-size:12.5px}
.soon{color:var(--muted);font-size:12.5px}
.back{display:inline-block;color:var(--primary);font-weight:700;text-decoration:none;font-size:14px;margin-bottom:10px}
.pheader{margin-bottom:16px}
.phrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.phrow h1{font-size:clamp(24px,3.4vw,34px);font-weight:800}
.pheader p.lead{color:var(--muted);margin:8px 0 0;max-width:90ch}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:700}
.hint{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.psec{margin-bottom:16px}
.ph2{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.ph2 h2{margin:0}
.ph2 .sub{margin:3px 0 0}
.pact{display:flex;gap:8px;align-items:center;flex:none}
.sample{background:var(--warn-soft);color:var(--warn);padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.cbtn{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--primary);cursor:pointer}
.cbtn:hover{background:var(--primary-soft)}
.pgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));margin-bottom:16px}
.pgrid .psec{margin-bottom:0}
.objs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.obj{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.obj b{font-weight:700;font-size:14.5px;line-height:1.35}
.chipst{align-self:flex-start;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:700}
.chipst.live{background:var(--live-soft);color:var(--live)}
.chipst.test{background:var(--primary-soft);color:var(--primary)}
.chipst.plan{background:var(--plan-soft);color:var(--plan)}
.chipst.warn{background:var(--warn-soft);color:var(--warn)}
.mb{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.mcol{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px}
.mcol h3{font-size:13.5px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.mcol h3 i{width:9px;height:9px;border-radius:50%}
.mi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13.5px;font-weight:600}
.nnl{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.nn{border-radius:14px;padding:14px}
.nn h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.nn ul{margin:0;padding-left:18px;font-size:14px}
.nn.now{background:var(--live-soft)}
.nn.next{background:var(--primary-soft)}
.nn.later{background:var(--plan-soft)}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.tile{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px}
.tile .n{font-size:22px;font-weight:800;line-height:1.2}
.tile .l{font-size:12.5px;color:var(--muted)}
.tb{border-collapse:collapse;width:100%;min-width:420px;font-size:13.5px}
.tb th{text-align:left;font-size:12px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);font-weight:700}
.tb td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.kv2{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv2:first-of-type{border-top:0}
.kv2 b{font-weight:700;text-align:right}

.chipst.bad{background:var(--bad-soft);color:var(--bad)}
.pill.cmain{color:var(--primary);cursor:pointer;font-weight:700}
.pill.cmain:hover{background:var(--primary-soft)}

#cmFloat{position:absolute;z-index:60;background:var(--primary);color:var(--panel);border:0;border-radius:99px;padding:6px 14px;font-weight:700;font-size:13px;box-shadow:var(--shadow);cursor:pointer}
</style>
</head>

  ].join('');
  const aiHtml = [
    head('Collaboration with AI', C.aiLead, ['#collab','Working together']),
    `<div class="banner">Spec first. AI builds. People decide. <span>One shared way to use AI on every slice of work.</span></div>`,
    sec('Spec-driven development (SDD)','Define what the software should do before anyone, human or AI, builds it. The spec is the shared source of truth between both teams, the AI coding agent and the codebase.', `<div class="sddgrid">` + sddFlow(C) + `<div class="sddr"><h3 class="subh">What goes in the spec</h3>` + tbl(['Spec field','What it answers'], C.spec.map(f=>[`<b>${f[0]}</b>`, f[1]])) + `<div class="nnl"><div class="nn now"><h3>Definition of ready</h3>${ul(C.ready)}</div><div class="nn next"><h3>Definition of done</h3>${ul(C.done)}</div></div><div class="nn later"><h3>Why spec first</h3>${ul(C.sddWhy)}</div></div></div>`, false),
    sec('AI in the loop','AI does the heavy lifting. People decide at every checkpoint.', `<div class="fl">${C.aiSteps.map((s,i)=>`${i?'<span class="ar">&rarr;</span>':''}<span class="fs ${s[1]}">${s[0]}</span>`).join('')}</div><div class="fkey"><span><i style="background:var(--live)"></i>Human checkpoint</span><span><i style="background:var(--test)"></i>AI-assisted step</span></div>`, false),
    `<div class="pgrid">`,
    sec('Shared assets','What both teams use, so AI output stays consistent.', ul(C.assets), false),
    sec('Guardrails','What AI tools may and may not do.', ul(C.guardrails), false),
    `</div>`,
    `<div class="pgrid">`,
    sec('Monthly AI knowledge session','Both teams meet once a month to share what works, what to learn next and where AI is heading.', C.session.cadence.map(r=>`<div class="kv2"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('') + `<h3 class="subh">What comes out of it</h3>` + ul(C.session.outputs), D),
    sec('Suggested agenda','One hour, four parts.', tbl(['Topic','Time'], C.session.agenda.map(a=>[a[0],a[1]])), D),
    `</div>`,
    dec(C.aiDecisions)
  ].join('');
  $('#viewCollab').innerHTML = kind==='ai' ? aiHtml : work;
  wireComments();
}
function route(){
  const m = location.hash.match(/^#p\/(\w+)/);
  const ov = $('#viewOverview'), pv = $('#viewProject'), cv = $('#viewCollab');
  const isC = location.hash === '#collab' || location.hash === '#ai';
  cv.hidden = !isC;
  const navs = [...document.querySelectorAll('.nav a')];
  const hit = navs.find(a=>a.getAttribute('href')===location.hash);
  navs.forEach(a=>a.classList.toggle('on', hit ? a===hit : a.getAttribute('href')==='#overview'));
  if(isC){ ov.hidden=true; pv.hidden=true; renderCollab(location.hash==='#ai'?'ai':'work'); window.scrollTo(0,0); }
  else if(m && Object.prototype.hasOwnProperty.call(PROJ, m[1])){ ov.hidden=true; pv.hidden=false; renderProject(m[1]); window.scrollTo(0,0); }
  else if(m && isSimple(m[1])){ ov.hidden=true; pv.hidden=false; renderSimple(m[1]); window.scrollTo(0,0); }
  else {
    pv.hidden=true; ov.hidden=false;
    const id = location.hash.slice(1), el = id && document.getElementById(id);
    if(el) el.scrollIntoView(); else window.scrollTo(0,0);
  }
}

// Comment anywhere: select text, then press the Comment bubble
let SELR = null, SELT = null;
const fb = document.createElement('button');
fb.id = 'cmFloat'; fb.type = 'button'; fb.textContent = 'Comment'; fb.hidden = true;
document.body.appendChild(fb);
fb.addEventListener('pointerdown', e=>e.preventDefault());
fb.addEventListener('mousedown', e=>e.preventDefault());
function showFloat(){
  if(!CM){ fb.hidden = true; return; }
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed || !sel.toString().trim()){ fb.hidden = true; return; }
  const r = sel.getRangeAt(0);
  SELR = r.cloneRange();
  const host = r.commonAncestorContainer.nodeType===1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
  const b = (r.getBoundingClientRect ? r.getBoundingClientRect() : host.getBoundingClientRect());
  const docW = document.documentElement.clientWidth;
  const left = Math.max(8, Math.min(window.scrollX + b.left + b.width/2 - 40, window.scrollX + docW - 100));
  const top = b.top < 52 ? window.scrollY + b.bottom + 8 : window.scrollY + b.top - 42;
  fb.style.left = left + 'px'; fb.style.top = top + 'px';
  fb.hidden = false;
}
document.addEventListener('selectionchange', ()=>{ clearTimeout(SELT); SELT = setTimeout(showFloat, 150); });
fb.addEventListener('click', async ()=>{
  if(!SELR || !CM) return;
  try{ await CM.openComposer({range:SELR}); }catch(e){}
  fb.hidden = true;
  const sel = window.getSelection(); if(sel) sel.removeAllRanges();
});
